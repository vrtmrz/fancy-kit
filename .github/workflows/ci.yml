name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npm exec --workspace octagonal-wheels -- playwright install --with-deps chromium

      - name: Check workspace
        run: npm run check:workspace

      - name: Run workspace tests
        run: npm run test:workspace

      - name: Build workspace packages
        run: npm run build:workspace

      - name: Build harness
        run: npm run build:harness

      - name: Verify package contents
        run: npm run pack:workspace

      - name: Verify packed consumers
        run: npm run verify:packed-consumer

      - name: Install pinned age interoperability tools
        run: npm run test:age:install-tools

      - name: Verify age interoperability
        run: npm run test:age:interop

      - name: Create package preview
        id: preview
        env:
          PREVIEW_DIRECTORY: '${{ runner.temp }}/fancy-kit-package-preview'
        run: node scripts/create-package-preview.mjs

      - name: Upload package preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: package-preview-${{ steps.preview.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ steps.preview.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
